{{ template "layout" . }}
{{ define "content" }}
<section>
    <h1>Projects</h1>

    {{ if .error }}
        <p class="error">{{ .error }}</p>
    {{ end }}

    {{ if .projects }}
        <div class="project-grid">
            {{ range .projects }}
            <div class="card">
                <h3>{{ .Title }}</h3>
                <p>{{ .Description }}</p>
                {{ if .URL }}
                    <a href="{{ .URL }}" class="btn" target="_blank">View Project</a>
                {{ end }}
            </div>
            {{ end }}
        </div>
    {{ else }}
        <p>No projects yet. Check back soon!</p>
    {{ end }}
</section>
{{ end }}
