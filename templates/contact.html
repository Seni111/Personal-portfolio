{{ define "content" }}
<section class="section-container" style="padding-top: 120px;">
    <div class="section-label">─── CONTACT ───</div>
    <h2 class="section-heading">Get In Touch</h2>
    <div class="divider-sm"></div>
    <p class="section-desc">Have a question or want to work together?</p>

    <div class="contact-card reveal">
        {{ if .success }}
            <div class="alert alert-success">{{ .success }}</div>
        {{ end }}

        {{ if .error }}
            <div class="alert alert-error">{{ .error }}</div>
        {{ end }}

        <form method="POST" action="/contact" class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>

            <button type="submit" class="btn-primary">Send Message</button>
        </form>

        <div class="contact-links">
            <a href="https://github.com/Seni111" target="_blank">GitHub</a>
            <a href="https://linkedin.com/in/senifila" target="_blank">LinkedIn</a>
            <a href="mailto:ezekielfila@gmail.com">Email</a>
        </div>
    </div>
</section>
{{ end }}
